name: Update Profile Statistics

on:
  schedule:
    # Run once per day at 00:15 UTC.
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: true

jobs:
  generate:
    name: Generate profile statistics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate activity dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: 009MHz
          # Only repositories listed here are used for Top Languages.
          FEATURED_REPOSITORIES: sportstream,playwright-demo
        run: python scripts/generate_profile_stats.py

      - name: Verify generated dashboard
        run: |
          test -f profile/activity.svg
          test -s profile/activity.svg
          grep -q '<svg ' profile/activity.svg
          grep -q '</svg>' profile/activity.svg
          grep -qi 'GitHub Activity' profile/activity.svg
          echo "profile/activity.svg is valid."

      - name: Remove legacy statistics
        run: |
          git rm -f profile/stats.svg profile/top-languages.svg profile/streak.svg 2>/dev/null || true

      - name: Stage generated dashboard
        run: git add profile/activity.svg

      - name: Commit updated dashboard
        run: |
          if git diff --cached --quiet; then
            echo "Profile statistics are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: update profile statistics"
          git push
