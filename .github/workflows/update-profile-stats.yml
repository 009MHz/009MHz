name: Update Profile Statistics

on:
  schedule:
    # Run once per day at 00:15 UTC.
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: true

jobs:
  generate:
    name: Generate profile statistics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVG statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: 009MHz
        run: python scripts/generate_profile_stats.py

      - name: Verify generated statistics
        run: |
          echo "Generated profile files:"
          find profile -maxdepth 1 -type f -print

          test -f profile/stats.svg
          test -f profile/top-languages.svg
          test -f profile/streak.svg

          echo "All required statistics files exist."

      - name: Stage updated statistics
        run: |
          git add profile/

      - name: Commit updated statistics
        run: |
          if git diff --cached --quiet; then
            echo "Profile statistics are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: update profile statistics"
          git push